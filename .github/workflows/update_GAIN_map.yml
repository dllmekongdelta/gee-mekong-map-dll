name: Update GAIN map

on:
  schedule:
    - cron: "30 17 * * *"    # 00:30 VN, daily -- GEE tile URLs in the HTML expire in <3 days
  workflow_dispatch:       # allow manual run from GitHub
  workflow_call:           # so it can be used in other workflows

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev proj-bin proj-data libproj-dev gdal-bin libgdal-dev

          pip install --upgrade pip
          pip uninstall -y geemap python-box || true
          pip install -r requirements.txt

          pip list

      - name: Save Service Account Key
        run: |
          echo '${{ secrets.GEE_KEY }}' > key.json

      - name: Run update notebook
        run: |
          jupyter nbconvert --to python MAP02_Mangrove_GAIN.ipynb
          python MAP02_Mangrove_GAIN.py
        env:
          GOOGLE_APPLICATION_CREDENTIALS: key.json
          GEE_SERVICE_ACCOUNT: ${{ secrets.GEE_SERVICE_ACCOUNT }}

      # Minify HTML to reduce load size
      - name: Minify HTML map
        run: |
          python - <<'EOF'
          import htmlmin, os
          filename = "Mangrove_GAIN_map.html"
          if os.path.exists(filename):
              html = open(filename).read()
              minified = htmlmin.minify(html, remove_empty_space=True)
              open(filename, "w").write(minified)
              print(f" Minified {filename}")
          else:
              print(" HTML file not found, skipping minification.")
          EOF

      - name: Commit and push results
        run: |
          git config user.name "Map Bot"
          git config user.email "bot@example.com"
          git add Mangrove_GAIN_map.html
          git commit -m "Automated map update" || echo "No changes to commit"

          # Commit first, then rebase onto whatever landed on main while the
          # notebook ran (e.g. another map workflow) -- each workflow only
          # touches its own HTML file, so the rebase always applies cleanly.
          # Retry in case another workflow pushes in between.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && exit 0
            echo "Push attempt $attempt failed, retrying..."; sleep 15
          done
          exit 1

      #  Warm up GitHub Pages CDN to prevent slow first load
      - name: Warm up GitHub Pages cache
        run: |
          sleep 10  # give GitHub Pages a few seconds to update
          curl -s https://dllmekongdelta.github.io/gee-mekong-map-dll/Mangrove_GAIN_map.html > /dev/null && echo "Cache warmed"
