<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mekong Delta Living Lab</title>
    <link rel="icon" href="images/logo/icon.png" type="image/logo">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.2.0/css/all.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo-section">
                    <div class="title-section">
                        <h1><i class="fas fa-leaf me-2"></i><span data-i18n="title">Mekong Delta Living Lab</span></h1>
                    </div>
                </div>
                <div class="lang-toggle">
                    <button class="lang-btn active" onclick="setLanguage('en')">
                        <span>EN</span>
                    </button>
                    <button class="lang-btn" onclick="setLanguage('vi')">
                        <span>VI</span>
                    </button>
                </div>
            </div>
        </div>
    </header>
    
    <!-- Navigation Tabs -->
    <nav class="nav-section">
        <div class="container">
            <div class="nav-tabs-custom">
                <button class="nav-tab coverage active" onclick="showMap('coverage')">
                    <i class="fas fa-tree"></i>
                    <span data-i18n="nav_coverage">Coverage Map</span>
                </button>
                <button class="nav-tab gain" onclick="showMap('gain')">
                    <i class="fas fa-arrow-up"></i>
                    <span data-i18n="nav_gain">Gain Map</span>
                </button>
                <button class="nav-tab loss" onclick="showMap('loss')">
                    <i class="fas fa-arrow-down"></i>
                    <span data-i18n="nav_loss">Loss Map</span>
                </button>
            </div>
        </div>
    </nav>
    
    <!-- Map Container -->
    <main class="map-container">
        <div class="container-fluid">
            <!-- Coverage Map -->
            <div id="coverage-panel" class="map-panel active">
                <div class="map-frame-wrapper">
                    <div class="map-header">
                        <div>
                            <span class="map-title" data-i18n="map_coverage_title">Mangrove Coverage Map</span>
                            <span class="map-badge coverage ms-2">1988-2026</span>
                        </div>
                        <a href="Mangrove_COVERAGE_map.html" target="_blank" class="open-new-tab">
                            <i class="fas fa-external-link-alt"></i>
                            <span data-i18n="open_fullscreen">Open Full Screen</span>
                        </a>
                    </div>
                    <iframe class="map-frame" src="Mangrove_COVERAGE_map.html" title="Mangrove Coverage Map"></iframe>
                </div>
            </div>
            
            <!-- Gain Map -->
            <div id="gain-panel" class="map-panel">
                <div class="map-frame-wrapper">
                    <div class="map-header">
                        <div>
                            <span class="map-title" data-i18n="map_gain_title">Mangrove Gain Map</span>
                            <span class="map-badge gain ms-2">1988-2026</span>
                        </div>
                        <a href="Mangrove_GAIN_map.html" target="_blank" class="open-new-tab">
                            <i class="fas fa-external-link-alt"></i>
                            <span data-i18n="open_fullscreen">Open Full Screen</span>
                        </a>
                    </div>
                    <iframe class="map-frame" src="Mangrove_GAIN_map.html" title="Mangrove Gain Map"></iframe>
                </div>
            </div>
            
            <!-- Loss Map -->
            <div id="loss-panel" class="map-panel">
                <div class="map-frame-wrapper">
                    <div class="map-header">
                        <div>
                            <span class="map-title" data-i18n="map_loss_title">Mangrove Loss Map</span>
                            <span class="map-badge loss ms-2">1988-2026</span>
                        </div>
                        <a href="Mangrove_LOSS_map.html" target="_blank" class="open-new-tab">
                            <i class="fas fa-external-link-alt"></i>
                            <span data-i18n="open_fullscreen">Open Full Screen</span>
                        </a>
                    </div>
                    <iframe class="map-frame" src="Mangrove_LOSS_map.html" title="Mangrove Loss Map"></iframe>
                </div>
            </div>
        </div>
    </main>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/i18n.js"></script>
    <script>
        function showMap(mapType) {
            // Hide all panels
            document.querySelectorAll('.map-panel').forEach(panel => {
                panel.classList.remove('active');
            });
            
            // Remove active from all tabs
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // Show selected panel
            document.getElementById(mapType + '-panel').classList.add('active');
            
            // Activate selected tab
            document.querySelector('.nav-tab.' + mapType).classList.add('active');
        }
        
        // Initialize language on page load
        document.addEventListener('DOMContentLoaded', function() {
            const savedLang = localStorage.getItem('language') || 'en';
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
